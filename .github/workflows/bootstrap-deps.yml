name: Bootstrap dependencies

# One-time / maintenance workflow: aligns apps/mobile with Expo SDK 56 via
# `expo install --fix`, regenerates package-lock.json, and opens a PR.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Align Expo SDK 56 dependencies
        working-directory: apps/mobile
        run: npx expo install --fix
      - run: npm install --no-audit --no-fund
      - name: Typecheck, test, doctor
        run: |
          npm run typecheck
          npm test
          (cd apps/mobile && npx expo-doctor)
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/deps-lockfile-${{ github.run_id }}"
          git checkout -b "$branch"
          git add package-lock.json apps/*/package.json packages/*/package.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "chore: align Expo SDK 56 dependencies and add lockfile"
          git push origin "$branch"
          gh pr create --title "chore: align Expo SDK 56 dependencies and add lockfile" --body "Generated by the Bootstrap dependencies workflow after typecheck, tests and expo-doctor passed." --base "${{ github.event.repository.default_branch }}" --head "$branch"
