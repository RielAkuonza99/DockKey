name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require lockfile
        run: test -f package-lock.json || (echo "package-lock.json missing. Run the 'Bootstrap dependencies' workflow." && exit 1)
      - name: Secret scan
        run: .github/check-secrets.sh
      - name: Install (npm ci)
        run: npm ci --no-audit --no-fund
      - name: Typecheck (all workspaces)
        run: npm run typecheck
      - name: Unit and handler tests
        run: npm test
      - name: Expo Doctor (required)
        working-directory: apps/mobile
        run: npx expo-doctor
      - name: Android bundle (expo export)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: https://dockkey-ci.invalid
        run: npx expo export --platform android
