name: EAS Android build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: production

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build APK on EAS
        working-directory: apps/mobile
        run: |
          eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --json > build.json
          cat build.json
          url=$(node -e "const b=JSON.parse(require('fs').readFileSync('build.json','utf8'));console.log((Array.isArray(b)?b[0]:b).artifacts?.buildUrl||'')")
          echo "### APK (${{ inputs.profile }})" >> "$GITHUB_STEP_SUMMARY"
          echo "${url:-No artifact URL returned}" >> "$GITHUB_STEP_SUMMARY"
